openapi: 3.0.0
info:
  title: 9Router AI Gateway API
  description: Multi-provider AI gateway with fallback routing and caching
  version: 1.0.0
  contact:
    name: AI Gateway Team
    url: http://127.0.0.1:20128
  x-logo:
    url: http://127.0.0.1:20128/logo.png

servers:
  - url: http://127.0.0.1:20128
    description: Local 9Router instance
  - url: http://localhost:20128
    description: Localhost

tags:
  - name: Chat
    description: Chat completion endpoints
  - name: Models
    description: Model management
  - name: Health
    description: Health checks

paths:
  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Create chat completion
      description: |
        Generate chat completions using configured AI providers.
        Supports multi-turn conversations with various models.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  example: "gpt-3.5-turbo"
                  description: Model identifier (supports routing patterns)
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  default: 0.7
                top_p:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 1
                max_tokens:
                  type: integer
                  minimum: 1
                  default: 2048
      responses:
        '200':
          description: Successful completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    enum: [chat.completion]
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                        finish_reason:
                          type: string
                          enum: [stop, length, content_filter]
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '429':
          description: Rate limited
        '500':
          description: Server error

  /v1/models:
    get:
      tags:
        - Models
      summary: List available models
      description: Get list of all models available through 9Router
      operationId: listModels
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          enum: [model]
                        owned_by:
                          type: string
                        permission:
                          type: array

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check 9Router service health
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time

  /api/usage:
    get:
      tags:
        - Health
      summary: Get API usage statistics
      description: Retrieve usage stats for monitoring and billing
      operationId: getUsage
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_requests:
                    type: integer
                  total_tokens:
                    type: integer
                  by_model:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        requests:
                          type: integer
                        tokens:
                          type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OpenAI API key format

security:
  - bearerAuth: []
